services:

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: amlak
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build: ./backend
    command: sh -c "npx prisma generate && npx prisma db push && npx tsx watch src/app.ts"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:1234@db:5432/amlak
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db

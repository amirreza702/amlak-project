services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: amlak
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build: ./backend
    command: sh -c "npx prisma generate && npx prisma db push && npx tsx watch src/app.ts"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:1234@db:5432/amlak
      CHOKIDAR_USEPOLLING: "true"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3002"
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
    restart: unless-stopped

  # نسخهٔ پیش‌فرض PWA: خروجی استاتیک با fallback مسیر ملک و پراکسی API.
  # URL اصلی برنامه روی localhost:3000 باقی می‌ماند.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.static
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # اجرای توسعه‌ای اختیاری با Hot Reload؛ با پروفایل dev و روی پورت 3002.
  # اجرا: docker compose --profile dev up --build -d frontend-dev
  frontend-dev:
    profiles:
      - dev
    build: ./frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      BACKEND_INTERNAL_URL: http://backend:4000
    ports:
      - "${FRONTEND_DEV_PORT:-3002}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

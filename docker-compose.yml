

services:
  backend:
    build: ./backend
    container_name: amlak_backend_dev
    ports:
      - "5000:5000"
    volumes:
      # همگام‌سازی زنده کدهای بک‌اند
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgres://postgres:1234@db:5432/amlak_db
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: amlak_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      # همگام‌سازی زنده کدهای فرانت‌اند (Hot-Reload)
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: amlak_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: amlak_db
    ports:
      - "5432:5432"
    volumes:
      # ذخیره پایدار داده‌های دیتابیس در ولوم مجزا
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

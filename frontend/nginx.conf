server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # تمام شناسه‌های ملک، از جمله شناسه‌هایی که پس از Build ثبت می‌شوند،
    # به فایل استاتیک مشترک هدایت می‌شوند؛ URL مرورگر عوض نمی‌شود.
    location = /property {
        return 301 /property/;
    }

    location = /property/ {
        try_files /property/__csr__.html =404;
    }

    location ^~ /property/ {
        try_files $uri $uri.html /property/__csr__.html;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
